services:
  mysql:
    image: mysql:8.0
    container_name: roadrescue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-roadrescue123}
      MYSQL_DATABASE: RoadRescueDB
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-roadrescue123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: roadrescue-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/RoadRescueDB
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-roadrescue123}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_dummy_key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@roadrescue.local}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PORT: 8082
    ports:
      - "8082:8082"

volumes:
  mysql-data:
